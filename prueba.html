<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestión de Horarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
      body {
        padding: 20px;
        background-color: #f8f9fa;
      }
      .hidden {
        display: none !important;
      }
      .day-select {
        margin-bottom: 15px;
      }
      .centered-div {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      #loginDiv {
        background-image: url("https://images.unsplash.com/photo-1506765515384-028b60a970df");
        background-size: cover;
        background-position: center;
      }

      #formDiv {
        background-image: url("https://images.unsplash.com/photo-1506765515384-028b60a970df");
        background-size: cover;
        background-position: center;
        padding: 30px;
        border-radius: 8px;
      }

      #tablaDiv {
        background-image: url("https://images.unsplash.com/photo-1506765515384-028b60a970df"); /* o usa una imagen local o de red */
        background-size: cover;
        background-position: center;
        border-radius: 15px;
        padding: 0;
        width: 100%;
        min-height: 100vh; /* 👈 asegura que ocupe altura completa de pantalla */
      }

      .contenidoTabla {
        background-color: rgba(
          173,
          216,
          230,
          0.95
        ); /* fondo celeste claro con opacidad */
        border-radius: 15px;
        padding: 20px;
        width: 100%;
        height: 100%;
      }

      #tablaHorario {
        width: 100%; /* ocupa todo el ancho disponible */
        table-layout: auto; /* ancho dinámico según contenido */
      }

      #tablaHorario th,
      #tablaHorario td {
        white-space: nowrap; /* evita salto de línea dentro de la celda */
        vertical-align: middle;
        padding: 8px;
        text-align: center;
        height: 50px;
      }

      #tablaHorario th:last-child,
      #tablaHorario td:last-child {
        width: 12%;
      }
    </style>
  </head>
  <body>
    <!-- Login -->
    <div id="loginDiv" class="centered-div">
      <div class="card shadow square-card">
        <div class="card-body">
          <h3 class="card-title text-center">Login Administrador</h3>
          <div class="mb-3">
            <label for="adminPass" class="form-label">Contraseña</label>
            <input
              type="password"
              id="adminPass"
              class="form-control"
              placeholder="Ingrese contraseña"
            />
          </div>
          <div class="text-center">
            <button class="btn btn-primary" onclick="login()">Ingresar</button>
          </div>
          <p id="loginError" class="text-danger mt-2 text-center"></p>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <div id="formDiv" class="container hidden">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title">Cargar datos del empleado</h3>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del empleado</label>
            <input type="text" id="nombre" class="form-control" />
          </div>
          <div class="mb-3">
            <label for="sucursal" class="form-label">Sucursal</label>
            <select id="sucursal" class="form-select">
              <option value="">-- Seleccionar sucursal --</option>
              <option value="Centro">Centro</option>
              <option value="Quaranta">Quaranta</option>
              <option value="Garupá">Garupá</option>
            </select>
          </div>
          <div id="diasInputs" class="row"></div>
          <div class="text-end">
            <button class="btn btn-success mt-3" onclick="guardarDatos()">
              Guardar
            </button>
          </div>
          <div class="text-end">
            <button class="btn btn-secondary mt-3" onclick="volverAlLogin()">
              Volver al Login
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenedor principal con fondo -->
    <div id="tablaDiv" class="container-fluid hidden mt-4">
      <!-- Contenido con fondo celeste claro -->
      <div class="contenidoTabla">
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Horarios Semanales</h3>
          <div>
            <button
              class="btn btn-secondary me-2"
              onclick="mostrarFormulario()"
            >
              Volver a carga
            </button>
            <button class="btn btn-danger" onclick="exportarPDF()">
              Exportar PDF
            </button>
          </div>
        </div>

        <!-- Tabla -->
        <table
          class="table table-striped table-bordered w-100"
          id="tablaHorario"
        >
          <thead class="table-dark">
            <tr>
              <th>Nombre</th>
              <th>Sucursal</th>
              <th>Lunes</th>
              <th>Martes</th>
              <th>Miércoles</th>
              <th>Jueves</th>
              <th>Viernes</th>
              <th>Sábado</th>
              <th>Domingo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalConfirmacion" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Empleado guardado</h5>
          </div>
          <div class="modal-body">
            <p>¿Desea cargar otro empleado o finalizar?</p>
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-primary"
              data-bs-dismiss="modal"
              onclick="resetFormulario()"
            >
              Cargar otro
            </button>
            <button
              class="btn btn-success"
              data-bs-dismiss="modal"
              onclick="mostrarTabla()"
            >
              Finalizar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const dias = [
        "Lunes",
        "Martes",
        "Miércoles",
        "Jueves",
        "Viernes",
        "Sábado",
        "Domingo",
      ];
      const horarios = {
        "Turno Mañana C": "06:45 a 14:30",
        "Turno Tarde C": "14:30 a 20:30",
        "Turno Mañana Q": "07:00 a 15:00",
        "Turno Tarde Q": "15:00 a 22:30",
        "Turno Mañana G": "08:00 a 15:00",
        "Turno Tarde G": "15:00 a 23:00",
      };

      const contenedorDias = document.getElementById("diasInputs");
      dias.forEach((dia) => {
        const col = document.createElement("div");
        col.className = "col-md-6 day-select";
        col.innerHTML = `
      <label class="form-label">${dia}</label>
      <select id="${dia}" class="form-select" onchange="mostrarHorario('${dia}')">
        <option value="">-- Seleccionar --</option>
        ${Object.keys(horarios)
          .map((t) => `<option value="${t}">${t}</option>`)
          .join("")}
        <option value="Franco">Franco</option>
        <option value="Vacaciones">Vacaciones</option>
      </select>
      <div id="${dia}Horario" class="text-muted small"></div>
    `;
        contenedorDias.appendChild(col);
      });

      function mostrarHorario(dia) {
        const valor = document.getElementById(dia).value;

        let hora = "";
        if (horarios[valor]) {
          hora = `Horario: ${horarios[valor]}`;
        }

        // Agregado: condición especial para Turno Tarde Q en días específicos
        if (
          valor === "Turno Tarde Q" &&
          ["Jueves", "Viernes", "Sábado", "Domingo"].includes(dia)
        ) {
          hora = "Horario: 15:00hs a 00:00hs";
        }

        document.getElementById(`${dia}Horario`).textContent = hora;
      }

      function login() {
        const pass = document.getElementById("adminPass").value.trim();
        if (pass === "admin123") {
          document.getElementById("loginDiv").classList.add("hidden");
          document.getElementById("formDiv").classList.remove("hidden");
        } else {
          document.getElementById("loginError").textContent =
            "Contraseña incorrecta.";
        }
      }

      let empleados = [];
      let editandoIndex = null;

      function guardarDatos() {
        const nombre = document.getElementById("nombre").value.trim();
        const sucursal = document.getElementById("sucursal").value;
        if (!nombre || !sucursal) return alert("Complete todos los campos");

        const turnos = {};
        dias.forEach((dia) => {
          let val = document.getElementById(dia).value;
          turnos[dia] = val ? val : "-";
        });

        const nuevoEmpleado = { nombre, sucursal, turnos };

        if (editandoIndex !== null) {
          empleados[editandoIndex] = nuevoEmpleado;
          editandoIndex = null;
          mostrarTabla();
        } else {
          empleados.push(nuevoEmpleado);
          $("#modalConfirmacion").modal("show");
        }
      }
      function mostrarTabla() {
        document.getElementById("formDiv").classList.add("hidden");
        document.getElementById("tablaDiv").classList.remove("hidden");

        const tbody = document.querySelector("#tablaHorario tbody");
        tbody.innerHTML = "";

        empleados.forEach((emp, index) => {
          const fila = document.createElement("tr");
          fila.innerHTML = `
        <td>${emp.nombre}</td>
        <td>${emp.sucursal}</td>
        ${dias.map((d) => `<td>${emp.turnos[d]}</td>`).join("")}
        <td>
          <button class="btn btn-sm btn-warning" onclick="editar(${index})">Editar</button>
          <button class="btn btn-sm btn-danger" onclick="eliminar(${index})">Eliminar</button>
        </td>
      `;
          tbody.appendChild(fila);
        });

        if (!$.fn.DataTable.isDataTable("#tablaHorario")) {
          $("#tablaHorario").DataTable({
            autoWidth: true,
            paging: true,
            searching: true,
            order: [[0, "asc"]],
            destroy: true,
            language: {
              search: "Buscar:",
              lengthMenu: "Mostrar _MENU_ registros",
              info: "Mostrando _START_ a _END_ de _TOTAL_ entradas",
              paginate: {
                previous: "Anterior",
                next: "Siguiente",
              },
            },
          });
        } else {
          $("#tablaHorario").DataTable().clear().destroy();
          mostrarTabla(); // Recargar tabla para nuevos datos
        }
      }

      function editar(index) {
        const emp = empleados[index];
        document.getElementById("formDiv").classList.remove("hidden");
        document.getElementById("tablaDiv").classList.add("hidden");

        document.getElementById("nombre").value = emp.nombre;
        document.getElementById("sucursal").value = emp.sucursal;
        dias.forEach((d) => {
          const val = emp.turnos[d].split(" (")[0]; // eliminar horario
          document.getElementById(d).value = val;
          mostrarHorario(d);
        });

        editandoIndex = index; // << Esto guarda el índice para editar
      }
      function eliminar(index) {
        if (confirm("¿Eliminar este empleado?")) {
          empleados.splice(index, 1);
          mostrarTabla();
        }
      }

      function resetFormulario() {
        document.getElementById("formDiv").classList.remove("hidden");
        document.getElementById("tablaDiv").classList.add("hidden");
        document.getElementById("nombre").value = "";
        document.getElementById("sucursal").value = "";
        dias.forEach((d) => {
          document.getElementById(d).value = "";
          document.getElementById(`${d}Horario`).textContent = "";
        });
      }

      function limpiarFormulario() {
        document.getElementById("nombre").value = "";
        document.getElementById("sucursal").value = "";
        dias.forEach((d) => {
          document.getElementById(d).value = "";
          document.getElementById(`${d}Horario`).textContent = "";
        });
        editandoIndex = null; // para asegurar que no queda en modo edición
      }
      function volverAlLogin() {
        document.getElementById("formDiv").classList.add("hidden");
        document.getElementById("loginDiv").classList.remove("hidden");
        limpiarFormulario(); // opcional, para limpiar los campos
      }

      function mostrarFormulario() {
        document.getElementById("formDiv").classList.remove("hidden");
        document.getElementById("tablaDiv").classList.add("hidden");
        limpiarFormulario(); // Limpia el formulario al mostrarlo
      }

      async function exportarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: "landscape",
          unit: "mm",
          format: "a4",
        });

        const tabla = document.querySelector("#tablaHorario");
        doc.text("Horarios Semanales", 10, 10);
        await doc.autoTable({ html: tabla, startY: 20, useCss: true });
        doc.save("horarios.pdf");
      }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.30/jspdf.plugin.autotable.min.js"></script>
  </body>
</html>
